<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOVE.exe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf7ff,#fff2f8,#edf2ff);font-family:Tahoma,sans-serif;color:#627b9e}.card{width:100%;max-width:390px;padding:30px 20px;text-align:center;background:#ffffffed;border:2px solid #dcecff;border-radius:28px;box-shadow:0 12px 35px #a0bedc40}h1{color:#91acd5;font-size:25px}p{line-height:2}button{border:0;border-radius:18px;background:#f7d8e8;color:#795f80;padding:13px 18px;margin:7px;font-size:15px}input{width:90%;padding:14px;border:2px solid #d9eaff;border-radius:15px;text-align:center;font-size:17px}.love{direction:ltr;color:#88aee0;font-weight:bold;font-size:19px;line-height:2.1}.hidden{display:none}</style><body><main class="card"><section id="welcome"><h1>LOVE.exe ♡</h1><p>سلام بیبی</p><button onclick="show('login')">شروع کنیم ♡</button></section><section id="login" class="hidden"><h1>اسم زنت رو وارد کن</h1><input id="name" placeholder="اسم رو اینجا بنویس"><br><button onclick="checkName()">ورود</button><p id="error"></p></section><section id="question" class="hidden"><h1>خوش اومدی عشق 💘✋🏻</h1><div id="loves" class="love"></div><p>آیا نها رو دوست داری؟</p><button onclick="answer()">بله</button><button onclick="answer()">YES</button><button onclick="answer()">گزینه اول و دوم</button><button onclick="answer()">همه گزینه‌ها</button></section><section id="final" class="hidden"><h1>عاشق ماشقتتتت بانو</h1><div id="finalLoves" class="love"></div></section></main><script>function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function checkName(){if(document.getElementById('name').value.trim()==='نها'){show('question');loves.innerHTML=Array(25).fill('I LOVE YOU').join('<br>')}else error.textContent='سیکتیر'}function answer(){show('final');finalLoves.innerHTML=Array(30).fill('I LOVE YOU').join('<br>')}</script></body></html>
